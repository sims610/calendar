name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > client/public/version.json

      - name: Build
        env:
          VITE_API_URL: https://calendar-service.byucanadian.click
        run: |
          npm ci && npm run build
          cp client/dist/index.html client/dist/404.html

      - name: Update pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: client/dist/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  push-image:
    name: Push server image to ECR
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Write config file
        env:
          DB_HOSTNAME: ${{ secrets.DB_HOSTNAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          node -e '
            const config = {
              db: {
                connection: {
                  host: process.env.DB_HOSTNAME,
                  user: process.env.DB_USERNAME,
                  password: process.env.DB_PASSWORD,
                  database: "calendar",
                  connectTimeout: 60000,
                },
                listPerPage: 10,
              },
            };
            require("fs").writeFileSync("server/src/config.js", `export default ${JSON.stringify(config, null, 2)};`);
          '

      - name: Create OIDC token to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          audience: sts.amazonaws.com
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT }}:role/${{ secrets.CI_IAM_ROLE }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up machine emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker build
        uses: docker/setup-buildx-action@v4

      - name: Build and push container image
        id: build-image
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/calendar-service
        run: |
          docker build --platform=linux/arm64 -t "$IMAGE:latest" --push server
          echo "image=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Deploy new container
        run: |
          aws ecs update-service --cluster calendar-service --service calendar-service --force-new-deployment
